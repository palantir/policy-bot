name: go mod tidy

on:
  push:
    branches: [develop]
    tags-ignore:
      - '**'

  pull_request:

jobs:
  go-mod-tidy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set Go version
      id: go_version
      run: |
        GO_VERSION=$(sed -E -n '/^go / s/^go ([0-9]+\.[0-9]+)(\.[0-9]+)?$/\1/p' < go.mod)
        echo "version=${GO_VERSION}" >> $GITHUB_OUTPUT

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ steps.go_version.outputs.version }}

    - name: Check go mod tidy
      run: |
        cp go.mod go.mod.orig
        cp go.sum go.sum.orig
        go mod tidy
        if ! diff -q go.mod go.mod.orig > /dev/null 2>&1 || ! diff -q go.sum go.sum.orig > /dev/null 2>&1; then
          echo "go.mod or go.sum is not tidy. Please run 'go mod tidy' and commit the changes."
          echo ""
          echo "go.mod diff:"
          diff go.mod go.mod.orig || true
          echo ""
          echo "go.sum diff:"
          diff go.sum go.sum.orig || true
          exit 1
        fi
