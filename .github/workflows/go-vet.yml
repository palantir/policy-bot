name: go vet

on:
  push:
    branches: [develop]
    tags-ignore:
      - '**'

  pull_request:

jobs:
  go-vet:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set Go version
      id: go_version
      run: |
        GO_VERSION=$(sed -E -n '/^go / s/^go ([0-9]+\.[0-9]+)(\.[0-9]+)?$/\1/p' < go.mod)
        echo "version=${GO_VERSION}" >> $GITHUB_OUTPUT

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ steps.go_version.outputs.version }}

    - name: Run go vet
      run: go vet ./...
      env:
        GOFLAGS: "-mod=vendor"
